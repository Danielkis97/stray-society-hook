# The same compiler settings as the protocol repository, so this source verifies against the
# deployed hook byte for byte.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
remappings = [
    "v4-core/=lib/v4-core/",
]
